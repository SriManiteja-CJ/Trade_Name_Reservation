[project]
name = "trade-name-intelligence-service"
version = "0.1.0"
description = "Trade Name Intelligence Service — LLM-assisted Arabic/English trade name validation"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "pyjwt>=2.8.0",

    # Data access
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",

    # Background jobs & cache
    "arq>=0.26.0",
    "redis[hiredis]>=5.1.0",

    # Arabic NLP
    "camel-tools>=1.5.4",

    # Fuzzy matching
    "rapidfuzz>=3.9.0",

    # HTTP client (for vLLM / TEI)
    "httpx>=0.27.0",

    # Observability
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "anyio>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "pipeline", "llm", "index", "copilot", "lexicon", "audit", "eval", "db", "config"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["api", "pipeline", "llm", "index", "copilot", "lexicon", "audit", "db", "config"]
